<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gravelmap.be</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map-container {
  position: relative;
  height: 100vh;
}

#map {
  height: 100%;
}

/* CONTROLS */
#controls {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 1000;
}

#controls button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #2e7d32;
  color: white;
  font-size: 14px;
}

/* LEGEND */
#legend {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 1000;
  background: rgba(255,255,255,0.95);
  padding: 12px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  font-size: 14px;
}

.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}

.legend-item input {
  margin-right: 6px;
}

.legend-color {
  width: 16px;
  height: 16px;
  margin-right: 6px;
  border-radius: 3px;
}

/* TOOLTIP */
#tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 6px 8px;
  border-radius: 4px;
  font-size: 12px;
  z-index: 2000;
  display: none;
  max-width: 260px;
}

/* OSM INFO */
#osm-info {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  background: rgba(255,255,255,0.9);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
}
</style>
</head>

<body>

<div id="map-container">

  <div id="map"></div>
  <div id="tooltip"></div>

  <div id="controls">
    <button onclick="loadData()">Charger cette zone</button>
  </div>

  <div id="legend">
    <strong>Revêtements</strong><br><br>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('paves')">
      <div class="legend-color" style="background:#999"></div>
      Pavés
    </label>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('gravel_roulant')">
      <div class="legend-color" style="background:#7CFC00"></div>
      Graviers roulants
    </label>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('chemin_12')">
      <div class="legend-color" style="background:#228B22"></div>
      Chemins grade 1–2 (surface non gravel)
    </label>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('grade3_surface')">
      <div class="legend-color" style="background:#FFD700"></div>
      Grade 3 – surface connue
    </label>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('grade3_unknown')">
      <div class="legend-color" style="background:#FF8C00"></div>
      Grade 3 – surface inconnue
    </label>
  </div>

  <div id="osm-info">
    Carte générée avec les données OpenStreetMap.<br>
    La réalité peut différer des données.
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([50.6, 4.5], 8);
const tooltip = document.getElementById("tooltip");

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// Layer groups
const layers = {
  paves: L.layerGroup().addTo(map),
  gravel_roulant: L.layerGroup().addTo(map),
  chemin_12: L.layerGroup().addTo(map),
  grade3_surface: L.layerGroup().addTo(map),
  grade3_unknown: L.layerGroup().addTo(map)
};

function toggleLayer(name) {
  map.hasLayer(layers[name])
    ? map.removeLayer(layers[name])
    : map.addLayer(layers[name]);
}

function clearLayers() {
  Object.values(layers).forEach(l => l.clearLayers());
}

function showTooltip(e, tags) {
  tooltip.style.display = "block";
  tooltip.style.left = (e.originalEvent.pageX + 12) + "px";
  tooltip.style.top = (e.originalEvent.pageY + 12) + "px";

  tooltip.innerHTML = `
    <strong>Chemin</strong><br>
    Grade : ${tags.tracktype || "non renseigné"}<br>
    Surface : ${tags.surface || "non renseignée"}<br>
    Type : ${tags.highway || "—"}
  `;
}

function hideTooltip() {
  tooltip.style.display = "none";
}

async function loadData() {
  clearLayers();

  const b = map.getBounds();
  const bbox = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;

  const query = `
  [out:json][timeout:25];
  (
    way["highway"="track"](${bbox});
    way["highway"="path"](${bbox});
  );
  out geom tags;
  `;

  const response = await fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: query
  });

  const data = await response.json();

  data.elements.forEach(el => {
    if (!el.geometry) return;

    const coords = el.geometry.map(p => [p.lat, p.lon]);
    const tags = el.tags || {};
    let layer = null;
    let color = null;

    // Pavés
    if (["sett","paving_stones","cobblestone"].includes(tags.surface)) {
      layer = layers.paves;
      color = "#999";
    }

    // Gravier roulant
    else if (["gravel","fine_gravel","compacted","pebblestone"].includes(tags.surface)) {
      layer = layers.gravel_roulant;
      color = "#7CFC00";
    }

    // Grade 1–2 non gravel
    else if ((tags.tracktype === "grade1" || tags.tracktype === "grade2")) {
      layer = layers.chemin_12;
      color = "#228B22";
    }

    // Grade 3 surface connue
    else if (tags.tracktype === "grade3" && tags.surface) {
      layer = layers.grade3_surface;
      color = "#FFD700";
    }

    // Grade 3 surface inconnue
    else if (tags.tracktype === "grade3") {
      layer = layers.grade3_unknown;
      color = "#FF8C00";
    }

    if (layer) {
      const line = L.polyline(coords, {
        color,
        weight: 4,
        opacity: 0.9
      });

      line.on("mousemove", e => showTooltip(e, tags));
      line.on("mouseout", hideTooltip);

      line.addTo(layer);
    }
  });
}
</script>

</body>
</html>
