<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Gravelmap.be — Carte gravel Belgique & France</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .legend {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: white;
      padding: 12px 14px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      font-size: 14px;
      line-height: 1.4em;
    }

    .legend div {
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* Couleurs Gravelmap */
    .grey { background-color: #7f8c8d; }       /* Pavés */
    .green-light { background-color: #2ecc71; } /* Graviers roulants */
    .green-dark { background-color: #27ae60; }  /* Chemins roulants inconnus */
    .yellow { background-color: #f1c40f; }      /* Gravel moins roulant */
    .orange { background-color: #e67e22; }      /* Surface incertaine */
  </style>
</head>

<body>

<div id="map"></div>

<!-- Légende -->
<div class="legend">
  <div><span class="dot grey"></span>Pavés</div>
  <div><span class="dot green-light"></span>Graviers roulants</div>
  <div><span class="dot green-dark"></span>Chemin roulant (surface inconnue)</div>
  <div><span class="dot yellow"></span>Gravier moins roulant</div>
  <div><span class="dot orange"></span>Surface incertaine</div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Initialisation de la carte
  const map = L.map('map').setView([50.6, 4.7], 7);

  // Fond de carte OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Popup d'information initial
  L.popup()
    .setLatLng([50.85, 4.35])
    .setContent(
      "<strong>Gravelmap.be</strong><br>" +
      "Carte gravel Belgique & France<br><br>" +
      "Carte générée à partir des données OpenStreetMap.<br>" +
      "La réalité du terrain peut parfois différer des données."
    )
    .openOn(map);
</script>

</body>
</html>
