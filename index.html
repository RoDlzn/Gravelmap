8        <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gravelmap.be</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map-container {
  position: relative;
  height: 100vh;
}

#map {
  height: 100%;
}

#legend {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 1000;
  background: rgba(255,255,255,0.95);
  padding: 12px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  font-size: 14px;
}

.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}

.legend-item input {
  margin-right: 6px;
}

.legend-color {
  width: 16px;
  height: 16px;
  margin-right: 6px;
  border-radius: 3px;
}

#controls {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 1000;
}

#controls button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #2e7d32;
  color: white;
  font-size: 14px;
}

#osm-info {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  background: rgba(255,255,255,0.9);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
}
</style>
</head>

<body>

<div id="map-container">

  <div id="map"></div>

  <div id="controls">
    <button onclick="loadData()">Charger cette zone</button>
  </div>

  <div id="legend">
    <strong>Revêtements</strong><br><br>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('paves')">
      <div class="legend-color" style="background:#999"></div>
      Pavés
    </label>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('gravel_roulant')">
      <div class="legend-color" style="background:#7CFC00"></div>
      Graviers roulants
    </label>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('chemin_12')">
      <div class="legend-color" style="background:#228B22"></div>
      Chemins grade 1–2 (Revêtements autres ou inconnus)
    </label>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('grade3_gravel')">
      <div class="legend-color" style="background:#FFD700"></div>
      Gravier moins roulant (grade 3)
    </label>

    <label class="legend-item">
      <input type="checkbox" checked onchange="toggleLayer('grade3_unknown')">
      <div class="legend-color" style="background:#FF8C00"></div>
      Grade 3 (surface autre ou inconnue)
    </label>
  </div>

  <div id="osm-info">
    Carte générée avec les données OpenStreetMap.<br>
    La réalité peut différer des données.
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([50.6, 4.5], 8);

// Fond de carte
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// Couches
const layers = {
  paves: L.layerGroup().addTo(map),
  gravel_roulant: L.layerGroup().addTo(map),
  chemin_12: L.layerGroup().addTo(map),
  grade3_gravel: L.layerGroup().addTo(map),
  grade3_unknown: L.layerGroup().addTo(map)
};

function toggleLayer(name) {
  map.hasLayer(layers[name])
    ? map.removeLayer(layers[name])
    : map.addLayer(layers[name]);
}

// Nettoyage avant rechargement
function clearLayers() {
  Object.values(layers).forEach(l => l.clearLayers());
}

// Chargement Overpass
async function loadData() {
  clearLayers();

  const b = map.getBounds();
  const bbox = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;

  const query = `
  [out:json][timeout:25];
  (
    way["highway"="track"](${bbox});
    way["highway"="path"](${bbox});
  );
  out geom;
  `;

  const url = "https://overpass-api.de/api/interpreter";

  const response = await fetch(url, {
    method: "POST",
    body: query
  });

  const data = await response.json();

  data.elements.forEach(el => {
    if (!el.geometry) return;

    const coords = el.geometry.map(p => [p.lat, p.lon]);
    const tags = el.tags || {};

    let layer = null;
    let color = "#000";

    if (tags.surface === "paving_stones","sett") {
      layer = layers.paves;
      color = "#999";
    }
    else if (["gravel", "compacted"].includes(tags.surface)) {
      layer = layers.gravel_roulant;
      color = "#7CFC00";
    }
    else if (tags.tracktype === "grade1" || tags.tracktype === "grade2") {
      layer = layers.chemin_12;
      color = "#228B22";
    }
    else if (tags.tracktype === "grade3" && tags.surface) {
      layer = layers.grade3_gravel;
      color = "#FFD700";
    }
    else if (tags.tracktype === "grade3") {
      layer = layers.grade3_unknown;
      color = "#FF8C00";
    }

    if (layer) {
      L.polyline(coords, {
        color: color,
        weight: 4,
        opacity: 0.9
      }).addTo(layer);
    }
  });
}
</script>

</body>
</html>
