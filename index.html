  <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Gravelmap.be</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    /* Conteneur global */
    #map-container {
      position: relative;
      height: 100vh;
      width: 100%;
    }

    /* Carte */
    #map {
      height: 100%;
      width: 100%;
    }

    /* Légende */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-size: 14px;
    }

    #legend h4 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      border-radius: 3px;
    }

    /* Popup info OSM */
    #osm-info {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

<div id="map-container">
  <div id="map"></div>

  <!-- Légende -->
  <div id="legend">
    <h4>Types de revêtement</h4>

    <div class="legend-item">
      <div class="legend-color" style="background: #999;"></div>
      Pavés
    </div>

    <div class="legend-item">
      <div class="legend-color" style="background: #7CFC00;"></div>
      Graviers roulants
    </div>

    <div class="legend-item">
      <div class="legend-color" style="background: #228B22;"></div>
      Chemins grade 1–2 (surface inconnue)
    </div>

    <div class="legend-item">
      <div class="legend-color" style="background: #FFD700;"></div>
      Gravier moins roulant (grade 3)
    </div>

    <div class="legend-item">
      <div class="legend-color" style="background: #FF8C00;"></div>
      Surface inconnue (grade 3)
    </div>
  </div>

  <!-- Info OSM -->
  <div id="osm-info">
    Carte générée avec les données OpenStreetMap.<br>
    La réalité peut parfois différer des données.
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([50.5, 4.5], 8);

  // Fond de carte OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Popup d'information initial
  L.popup()
    .setLatLng([50.85, 4.35])
    .setContent(
      "<strong>Gravelmap.be</strong><br>" +
      "Carte gravel Belgique & France<br><br>" +
      "Carte générée à partir des données OpenStreetMap.<br>" +
      "La réalité du terrain peut parfois différer des données."
    )
    .openOn(map);
</script>

</body>
</html>
