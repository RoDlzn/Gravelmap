<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gravelmap.be</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body { margin:0; padding:0; height:120%; font-family:Arial,sans-serif; }
#map-container { position:relative; height:100vh; }
#map { height:100%; }

/* Bouton central */
#controls-center {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
}

#controls-center button {
  padding:10px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#2e7d32;
  color:white;
}

/* Boutons en haut à droite */
#controls-right {
  position: absolute;
  top: 15px;
  right: 15px;
  z-index: 1000;
  display: flex;
  gap: 8px;
}

#controls-right button {
  padding:8px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#444;
  color:white;
  font-size:13px;
}


#legend {
  position:absolute; bottom:20px; left:20px; z-index:1000;
  background:rgba(255,255,255,0.95);
  padding:12px; border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  font-size:14px;
}
.legend-item { display:flex; align-items:center; margin-bottom:6px; }
.legend-item input { margin-right:6px; }
.legend-color { width:16px; height:16px; margin-right:6px; border-radius:3px; }

#tooltip {
  position:absolute; pointer-events:none;
  background:rgba(0,0,0,0.8); color:#fff;
  padding:6px 8px; border-radius:4px;
  font-size:12px; z-index:2000; display:none;
}

#osm-info {
  position:absolute; bottom:20px; right:20px;
  background:rgba(255,255,255,0.9);
  padding:8px 10px; border-radius:8px;
  font-size:12px;
}

#progress {
  position:absolute; top:60px; left:50%;
  transform:translateX(-50%);
  z-index:1100;
  background:rgba(0,0,0,0.7); color:#fff;
  padding:6px 10px; border-radius:6px; display:none;
  font-size:13px;
}
</style>
</head>

<body>
<div id="map-container">
  <div id="map"></div>
  <div id="tooltip"></div>
  <div id="progress"></div>

  <!-- Bouton centré -->
<div id="controls-center">
  <button id="btn-load" onclick="loadData()">Charger cette zone</button>
</div>

<!-- Boutons en haut à droite -->
<div id="controls-right">
  <button onclick="about()">À propos</button>
  <button onclick="openOSM()">Suggérer une modification</button>
  <button onclick="window.open('https://paypal.me/RomainDlz','_blank')">Faire un don ❤️</button>
</div>


  <div id="legend">
    <strong>Revêtements</strong><br><br>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('paves')">
      <div class="legend-color" style="background:#999"></div>Pavés</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('gravel_roulant')">
      <div class="legend-color" style="background:#7CFC00"></div>Vrais Gravels roulants</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('chemin_12')">
      <div class="legend-color" style="background:#228B22"></div>Autres chemins roulants</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('grade3_surface')">
      <div class="legend-color" style="background:#FFD700"></div>Chemins Gravel plus techniques</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('grade3_unknown')">
      <div class="legend-color" style="background:#FF8C00"></div>Chemins plus techniques</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('grade4')">
      <div class="legend-color" style="background:#d32f2f"></div>Chemins engagés</label>
  </div>

  <div id="osm-info">
    Données OpenStreetMap – indicatives uniquement
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/*
  Optimisations ajoutées :
  - preferCanvas pour Leaflet (meilleures performances quand il y a beaucoup de lignes)
  - découpage bbox en tuiles si la zone est "trop grande"
  - requêtes Overpass en série/parallèle limitée (pour éviter timeouts / erreurs)
  - simplification basique des géométries (élimine points trop proches)
  - cache par tuile (évite rechargements sur la même zone)
  - retour visuel de progression
*/

const map = L.map('map', { preferCanvas: true }).setView([50.6,4.5],8);
const tooltip=document.getElementById("tooltip");
const progressEl = document.getElementById("progress");
const btnLoad = document.getElementById("btn-load");

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

const layers={
  paves:L.layerGroup().addTo(map),
  gravel_roulant:L.layerGroup().addTo(map),
  chemin_12:L.layerGroup().addTo(map),
  grade3_surface:L.layerGroup().addTo(map),
  grade3_unknown:L.layerGroup().addTo(map),
  grade4:L.layerGroup().addTo(map)
};

function toggleLayer(n){ map.hasLayer(layers[n])?map.removeLayer(layers[n]):map.addLayer(layers[n]); }
function clearLayers(){ Object.values(layers).forEach(l=>l.clearLayers()); }

function showTooltip(e, tags){
  tooltip.style.display="block";
  tooltip.style.left=e.originalEvent.pageX+12+"px";
  tooltip.style.top=e.originalEvent.pageY+12+"px";
  tooltip.innerHTML = `
  <strong>Chemin</strong><br>
  Type : ${tags.highway || "—"}<br>
  Tracktype : ${tags.tracktype || "non renseigné"}<br>
  Surface : ${tags.surface || "non renseignée"}<br>
  <strong>Roulabilité :</strong> ${tags.smoothness || "non renseignée"}
`;
}
function hideTooltip(){ tooltip.style.display="none"; }

function openOSM(){
  const c=map.getCenter();
  window.open(`https://www.openstreetmap.org/#map=${map.getZoom()}/${c.lat}/${c.lng}`,'_blank');
}

function about(){
  alert("Gravelmap.be\n\nCette carte classe les chemins selon leur roulabilité estimée à partir des données OpenStreetMap.\nLes conditions réelles peuvent différer des données OpenStreetMap.\nZoomez sur la zone à découvrir et cliquez sur \"charger cette zone\" pour mettre en surbrillance les chemins gravel (charger une zone trop large pourrait provoquer des timeouts — la carte découpe et charge automatiquement en morceaux).");
}

/* --- Utilitaires --- */

// distance (m) entre 2 coordonnées (Haversine)
function haversineMeters(a,b){
  const R = 6371000;
  const toRad = Math.PI/180;
  const dLat = (b[0]-a[0])*toRad;
  const dLon = (b[1]-a[1])*toRad;
  const lat1 = a[0]*toRad;
  const lat2 = b[0]*toRad;
  const sinDLat = Math.sin(dLat/2);
  const sinDLon = Math.sin(dLon/2);
  const aa = sinDLat*sinDLat + Math.cos(lat1)*Math.cos(lat2)*sinDLon*sinDLon;
  return R * 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1-aa));
}

// simplification basique : supprime les points trop proches (minDist en mètres)
// très rapide et efficace pour réduire beaucoup de petits segments
function simplifyCoords(coords, minDistMeters=2){
  if(!coords || coords.length<=2) return coords;
  const out=[coords[0]];
  for(let i=1;i<coords.length;i++){
    const last = out[out.length-1];
    const cur = coords[i];
    if(haversineMeters(last, cur) >= minDistMeters) out.push(cur);
  }
  // always keep last
  if(out[out.length-1] !== coords[coords.length-1]) out.push(coords[coords.length-1]);
  return out;
}

/* --- Overpass / découpage --- */

const tileCache = new Map(); // cache simple par bbox string

// découpe une bbox Leaflet en tuiles carrées selon un max span en degrés
function splitBounds(bounds, maxLatSpan=0.4, maxLngSpan=0.6){
  const s = bounds.getSouth(), n = bounds.getNorth(), w = bounds.getWest(), e = bounds.getEast();
  const latSpan = n - s;
  const lngSpan = e - w;
  const rows = Math.max(1, Math.ceil(latSpan / maxLatSpan));
  const cols = Math.max(1, Math.ceil(lngSpan / maxLngSpan));
  const tileLat = latSpan / rows;
  const tileLng = lngSpan / cols;
  const tiles = [];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const ts = s + r*tileLat;
      const tn = (r===rows-1) ? n : (s + (r+1)*tileLat);
      const tw = w + c*tileLng;
      const te = (c===cols-1) ? e : (w + (c+1)*tileLng);
      tiles.push({s:ts, w:tw, n:tn, e:te});
    }
  }
  return tiles;
}

function bboxKey(tile){ return `${tile.s.toFixed(6)},${tile.w.toFixed(6)},${tile.n.toFixed(6)},${tile.e.toFixed(6)}`; }

async function fetchTile(tile, idx, total){
  const key = bboxKey(tile);
  if(tileCache.has(key)) {
    // console.log("cache hit", key);
    updateProgress(idx+1, total);
    return tileCache.get(key);
  }

  // Overpass query : on maintient le même filtre qu'avant
  const q = `[out:json][timeout:25];
(
  way["highway"~"track|path|cycleway|unclassified|service"](${tile.s},${tile.w},${tile.n},${tile.e});
);
out geom tags;`;

  try{
    const r = await fetch("https://overpass-api.de/api/interpreter", { method:"POST", body: q });
    if(!r.ok) throw new Error("overpass error "+r.status);
    const d = await r.json();
    tileCache.set(key, d);
    updateProgress(idx+1, total);
    return d;
  }catch(err){
    console.warn("Overpass fetch failed for tile", tile, err);
    updateProgress(idx+1, total);
    return { elements: [] };
  }
}

function updateProgress(done, total){
  if(total<=1){ progressEl.style.display="none"; return; }
  progressEl.style.display="block";
  progressEl.textContent = `Chargement ${done}/${total}...`;
  if(done>=total) setTimeout(()=>progressEl.style.display="none", 600);
}

/* --- Traitement et affichage --- */

function handleOverpassData(d){
  d.elements.forEach(el=>{
    if(!el.geometry) return;
    const c = el.geometry.map(p=>[p.lat,p.lon]);
    const t = el.tags||{};
    const s = t.surface;
    const g = t.tracktype;
    const sm = t.smoothness;

    let LYR=null, COL=null;

    if(["sett","unhewn_cobblestone","cobblestone","paving_stones"].includes(s)){
      LYR=layers.paves; COL="#999";
    }
    else if((g==="grade1"||g==="grade2") && ["compacted","gravel","fine_gravel","clay"].includes(s) && !["bad","very_bad","horrible"].includes(sm)){
      LYR=layers.gravel_roulant; COL="#7CFC00";
    }
    else if(((g==="grade1"||g==="grade2") && (!s || ["ground","dirt","earth","grass","woodchips","unpaved","compacted","fine_gravel"].includes(s))) && !["bad","very_bad","horrible"].includes(sm)){
      LYR=layers.chemin_12; COL="#228B22";
    }
    else if (!t.tracktype && ["compacted","fine_gravel","clay"].includes(t.surface) && !["asphalt","concrete","paved"].includes(t.surface)) {
      LYR = layers.chemin_12;
      COL = "#228B22";
    }
    else if(g==="grade3" && ["compacted","gravel","fine_gravel","clay"].includes(s) && !["bad","very_bad","horrible"].includes(sm)){
      LYR=layers.grade3_surface; COL="#FFD700";
    }
    else if(g==="grade3"){
      LYR=layers.grade3_unknown; COL="#FF8C00";
    }
    else if(g==="grade4"){
      LYR=layers.grade4; COL="#d32f2f";
    }

    if(LYR){
      const simplified = simplifyCoords(c, 2); // tol 2 m (ajuster si nécessaire)
      const poly = L.polyline(simplified, {color:COL, weight:4, opacity:0.9, renderer: L.canvas()});
      poly.on("mousemove", e => showTooltip(e, t));
      poly.on("mouseout", hideTooltip);
      poly.addTo(LYR);
    }
  });
}

/* --- Fonction principale de chargement --- */

async function loadData(){
  // UI / reset
  btnLoad.disabled = true;
  btnLoad.textContent = "Chargement…";
  clearLayers();

  const bounds = map.getBounds();
  const tiles = splitBounds(bounds);
  const total = tiles.length;

  // limite de concurrence : n requêtes Overpass simultanées
  const CONCURRENCY = 2;
  const results = [];

  // fetch par lots pour ne pas surcharger Overpass
  for(let i=0;i<tiles.length;i+=CONCURRENCY){
    const batch = tiles.slice(i, i+CONCURRENCY).map((t, idx)=>fetchTile(t, i+idx, total));
    const batchRes = await Promise.all(batch);
    results.push(...batchRes);
    // petit délai pour être plus "poli" si on a beaucoup de tuiles
    await new Promise(r => setTimeout(r, 250));
  }

  // traiter et afficher
  results.forEach(r => handleOverpassData(r));

  btnLoad.disabled = false;
  btnLoad.textContent = "Charger cette zone";
}

</script>
</body>
</html>
