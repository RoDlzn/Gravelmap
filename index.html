<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gravelsegments.com</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body { margin:0; padding:0; height:120%; font-family:Arial,sans-serif; }
#map-container { position:relative; height:100vh; }
#map { height:100%; }

/* Bouton central */
#controls-center {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
}

#controls-center button {
  padding:10px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#2e7d32;
  color:white;
}

/* Boutons en haut à droite */
#controls-right {
  position: absolute;
  top: 15px;
  right: 15px;
  z-index: 1000;
  display: flex;
  gap: 8px;
}

#controls-right button {
  padding:8px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#444;
  color:white;
  font-size:13px;
}


#legend {
  position:absolute; bottom:20px; left:20px; z-index:1000;
  background:rgba(255,255,255,0.95);
  padding:12px; border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  font-size:14px;
}
.legend-item { display:flex; align-items:center; margin-bottom:6px; }
.legend-item input { margin-right:6px; }
.legend-color { width:16px; height:16px; margin-right:6px; border-radius:3px; }

#tooltip {
  position:absolute; pointer-events:none;
  background:rgba(0,0,0,0.8); color:#fff;
  padding:6px 8px; border-radius:4px;
  font-size:12px; z-index:4000; display:none;
}

#osm-info {
  position:absolute; bottom:20px; right:20px;
  background:rgba(255,255,255,0.95);
  padding:8px 10px; border-radius:8px;
  font-size:12px;
  z-index:3500;
}

#progress {
  position:absolute; top:60px; left:50%;
  transform:translateX(-50%);
  z-index:4100;
  background:rgba(0,0,0,0.7); color:#fff;
  padding:6px 10px; border-radius:6px; display:none;
  font-size:13px;
}

#center-radius {
  position:absolute; top:100px; left:50%;
  transform:translateX(-50%);
  z-index:3300;
  background:rgba(255,255,255,0.95);
  padding:6px 10px; border-radius:6px; display:none;
  font-size:13px;
}

#controls-center small { display:block; font-size:11px; color:#eee; margin-top:6px; }
</style>
</head>

<body>
<div id="map-container">
  <div id="map"></div>
  <div id="tooltip"></div>
  <div id="progress"></div>
  <div id="center-radius"></div>

  <!-- Bouton centré -->
<div id="controls-center">
  <button id="btn-load" onclick="loadData()">Charger cette zone</button>
  <small><label><input type="checkbox" id="use-radius" checked> Utiliser radius max si zone trop grande</label></small>
</div>

<!-- Boutons en haut à droite -->
<div id="controls-right">
  <button onclick="about()">À propos</button>
  <button onclick="openOSM()">Suggérer une modification</button>
  <button onclick="window.open('https://paypal.me/RomainDlz','_blank')">Faire un don ❤️</button>
</div>


  <div id="legend">
    <strong>Revêtements</strong><br><br>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('paves')">
      <div class="legend-color" style="background:#999"></div>Pavés</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('gravel_roulant')">
      <div class="legend-color" style="background:#7CFC00"></div>Vrais Gravels roulants</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('chemin_12')">
      <div class="legend-color" style="background:#228B22"></div>Autres chemins roulants</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('grade3_surface')">
      <div class="legend-color" style="background:#FFD700"></div>Chemins Gravel plus techniques</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('grade3_unknown')">
      <div class="legend-color" style="background:#FF8C00"></div>Chemins plus techniques</label>

    <label class="legend-item"><input type="checkbox" checked onchange="toggleLayer('grade4')">
      <div class="legend-color" style="background:#d32f2f"></div>Chemins engagés</label>
  </div>

  <div id="osm-info">
    Données OpenStreetMap – indicatives uniquement
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/*
  Changements principaux par rapport à la version précédente :
  - Si la bbox est "trop grande", on passe en mode "radius centered" (chargement uniquement d'un cercle centré).
    Cela évite les timeouts Overpass quand l'utilisateur est fortement dézoomé.
  - Suppression du découpage automatique/chargement en tuiles par défaut (cause d'effets de fluidité).
    Chargement déclenché uniquement par le bouton "Charger cette zone".
  - Pendant le déplacement de la carte, les calques vectoriels sont temporairement masqués pour améliorer la fluidité.
  - On affiche un cercle indicatif et un message quand on utilise le radius centré.
  - Cache simple en mémoire par bbox pour éviter rechargements immédiats.
  - preferCanvas pour Leaflet + renderer canvas lors de la création des polylines.
*/

const MAX_RADIUS_METERS = 30000; // radius max à charger (par défaut 30 km)
const MAX_BBOX_DIAGONAL_METERS = 90000; // si la diagonal bbox > 90km on bascule en mode radius centered

const map = L.map('map', { preferCanvas: true }).setView([50.6,4.5],8);
const tooltip = document.getElementById("tooltip");
const progressEl = document.getElementById("progress");
const centerRadiusEl = document.getElementById("center-radius");
const btnLoad = document.getElementById("btn-load");
const useRadiusCheckbox = document.getElementById("use-radius");

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

const rendererCanvas = L.canvas();

const layers = {
  paves: L.layerGroup().addTo(map),
  gravel_roulant: L.layerGroup().addTo(map),
  chemin_12: L.layerGroup().addTo(map),
  grade3_surface: L.layerGroup().addTo(map),
  grade3_unknown: L.layerGroup().addTo(map),
  grade4: L.layerGroup().addTo(map)
};

function toggleLayer(n){ map.hasLayer(layers[n])?map.removeLayer(layers[n]):map.addLayer(layers[n]); }
function clearLayers(){ Object.values(layers).forEach(l=>l.clearLayers()); }

function showTooltip(e, tags){
  tooltip.style.display="block";
  tooltip.style.left=e.originalEvent.pageX+12+"px";
  tooltip.style.top=e.originalEvent.pageY+12+"px";
  tooltip.innerHTML = `
  <strong>Chemin</strong><br>
  Type : ${tags.highway || "—"}<br>
  Tracktype : ${tags.tracktype || "non renseigné"}<br>
  Surface : ${tags.surface || "non renseignée"}<br>
  <strong>Roulabilité :</strong> ${tags.smoothness || "non renseignée"}
`;
}
function hideTooltip(){ tooltip.style.display="none"; }

function openOSM(){
  const c=map.getCenter();
  window.open(`https://www.openstreetmap.org/#map=${map.getZoom()}/${c.lat}/${c.lng}`,'_blank');
}

function about(){
  alert("Gravelmap.be\n\nCette carte classe les chemins selon leur roulabilité estimée à partir des données OpenStreetMap.\nLes conditions réelles peuvent différer des données OpenStreetMap.\nZoomez sur la zone à découvrir et cliquez sur \"charger cette zone\" pour mettre en surbrillance les chemins gravel.\nSi la zone est très grande, la carte chargera uniquement un cercle centré pour éviter les timeouts.");
}

/* --- Utilitaires --- */

function haversineMeters(a,b){
  const R = 6371000;
  const toRad = Math.PI/180;
  const dLat = (b[0]-a[0])*toRad;
  const dLon = (b[1]-a[1])*toRad;
  const lat1 = a[0]*toRad;
  const lat2 = b[0]*toRad;
  const sinDLat = Math.sin(dLat/2);
  const sinDLon = Math.sin(dLon/2);
  const aa = sinDLat*sinDLat + Math.cos(lat1)*Math.cos(lat2)*sinDLon*sinDLon;
  return R * 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1-aa));
}

// simplification basique : supprime les points trop proches (minDist en mètres)
function simplifyCoords(coords, minDistMeters=2){
  if(!coords || coords.length<=2) return coords;
  const out=[coords[0]];
  for(let i=1;i<coords.length;i++){
    const last = out[out.length-1];
    const cur = coords[i];
    if(haversineMeters(last, cur) >= minDistMeters) out.push(cur);
  }
  if(out[out.length-1] !== coords[coords.length-1]) out.push(coords[coords.length-1]);
  return out;
}

// bbox -> degrees delta from center for a given radius (approx.)
function radiusToLatLngDeltaMeters(lat, meters){
  const latDeg = meters / 111320; // approx
  const lngDeg = meters / (111320 * Math.cos(lat * Math.PI / 180) || 1);
  return { latDeg, lngDeg };
}

const bboxCache = new Map();

function bboxKey(b){ return `${b.s.toFixed(6)},${b.w.toFixed(6)},${b.n.toFixed(6)},${b.e.toFixed(6)}`; }

function updateProgress(show, txt){
  if(!show){ progressEl.style.display='none'; return; }
  progressEl.style.display='block';
  progressEl.textContent = txt || 'Chargement…';
}

/* --- Overpass fetch (single bbox) --- */

async function fetchBBox(b){
  const key = bboxKey(b);
  if(bboxCache.has(key)) return bboxCache.get(key);

  const q = `[out:json][timeout:25];
(
  way["highway"~"track|path|cycleway|unclassified|service"](${b.s},${b.w},${b.n},${b.e});
);
out geom tags;`;

  try{
    const r = await fetch("https://overpass-api.de/api/interpreter", { method:"POST", body: q });
    if(!r.ok) throw new Error("overpass error "+r.status);
    const d = await r.json();
    bboxCache.set(key, d);
    return d;
  }catch(err){
    console.warn("Overpass fetch failed for bbox", b, err);
    return { elements: [] };
  }
}

/* --- Traitement des données et affichage --- */

function handleOverpassData(d){
  d.elements.forEach(el=>{
    if(!el.geometry) return;
    const c = el.geometry.map(p=>[p.lat,p.lon]);
    const t = el.tags||{};
    const s = t.surface;
    const g = t.tracktype;
    const sm = t.smoothness;

    let LYR=null, COL=null;

    if(["sett","unhewn_cobblestone","cobblestone","paving_stones"].includes(s)){
      LYR=layers.paves; COL="#999";
    }
    else if((g==="grade1"||g==="grade2") && ["compacted","gravel","fine_gravel","clay"].includes(s) && !["bad","very_bad","horrible"].includes(sm)){
      LYR=layers.gravel_roulant; COL="#7CFC00";
    }
    else if(((g==="grade1"||g==="grade2") && (!s || ["ground","dirt","earth","grass","woodchips","unpaved","compacted","fine_gravel"].includes(s))) && !["bad","very_bad","horrible"].includes(sm)){
      LYR=layers.chemin_12; COL="#228B22";
    }
    else if (!t.tracktype && ["compacted","fine_gravel","clay"].includes(t.surface) && !["asphalt","concrete","paved"].includes(t.surface)) {
      LYR = layers.chemin_12;
      COL = "#228B22";
    }
    else if(g==="grade3" && ["compacted","gravel","fine_gravel","clay"].includes(s) && !["bad","very_bad","horrible"].includes(sm)){
      LYR=layers.grade3_surface; COL="#FFD700";
    }
    else if(g==="grade3"){
      LYR=layers.grade3_unknown; COL="#FF8C00";
    }
    else if(g==="grade4"){
      LYR=layers.grade4; COL="#d32f2f";
    }

    if(LYR){
      const simplified = simplifyCoords(c, 2);
      const poly = L.polyline(simplified, {color:COL, weight:4, opacity:0.9, renderer: rendererCanvas, interactive: true});
      // attach lightweight handlers
      poly.on("mousemove", e => showTooltip(e, t));
      poly.on("mouseout", hideTooltip);
      poly.addTo(LYR);
    }
  });
}

/* --- Mode de chargement : bbox ou center-radius --- */

let currentCircle = null;

function showCenterCircle(center, radiusMeters){
  if(currentCircle) map.removeLayer(currentCircle);
  currentCircle = L.circle([center.lat, center.lng], { radius: radiusMeters, color:'#2e7d32', weight:1.5, fill:false, pane: 'overlayPane' }).addTo(map);
  centerRadiusEl.style.display='block';
  centerRadiusEl.textContent = `Chargement centré (rayon ${Math.round(radiusMeters/1000)} km)`;
}
function hideCenterCircle(){
  if(currentCircle){ map.removeLayer(currentCircle); currentCircle=null; }
  centerRadiusEl.style.display='none';
}

/* --- Fonction principale de chargement --- */

async function loadData(){
  btnLoad.disabled = true;
  btnLoad.textContent = "Chargement…";
  updateProgress(true, "Préparation…");
  hideTooltip();

  clearLayers();
  hideCenterCircle();

  const bounds = map.getBounds();
  // compute diagonal length
  const sw = [bounds.getSouth(), bounds.getWest()];
  const ne = [bounds.getNorth(), bounds.getEast()];
  const diagonal = haversineMeters(sw, ne);

  let bboxToFetch = null;
  let usedRadiusMode = false;
  if(useRadiusCheckbox.checked && diagonal > MAX_BBOX_DIAGONAL_METERS){
    // use center radius mode
    usedRadiusMode = true;
    const center = map.getCenter();
    const radiusMeters = Math.min(MAX_RADIUS_METERS, Math.floor(diagonal/4)); // if diagonal is huge, use smaller radius; cap to MAX
    const delta = radiusToLatLngDeltaMeters(center.lat, radiusMeters);
    bboxToFetch = { s: center.lat - delta.latDeg, w: center.lng - delta.lngDeg, n: center.lat + delta.latDeg, e: center.lng + delta.lngDeg };
    showCenterCircle(center, radiusMeters);
    updateProgress(true, "Chargement (mode radius centré) …");
  }else{
    bboxToFetch = { s: bounds.getSouth(), w: bounds.getWest(), n: bounds.getNorth(), e: bounds.getEast() };
    updateProgress(true, "Chargement de la bbox affichée …");
  }

  try{
    const data = await fetchBBox(bboxToFetch);
    handleOverpassData(data);
  }catch(err){
    console.error(err);
  }finally{
    updateProgress(false);
    btnLoad.disabled = false;
    btnLoad.textContent = "Charger cette zone";
    // retirer le cercle après un certain temps (optionnel)
    setTimeout(()=>{ if(currentCircle) hideCenterCircle(); }, 8000);
  }
}

/* --- Fluidité pendant le drag --- */
/* Masque temporairement le pane des vecteurs pendant le drag pour éviter le lag lié au redessin */
map.on('movestart', ()=> {
  // cacher overlay pane (vecteurs) pendant le drag
  try{
    const op = map.getPanes().overlayPane;
    op.style.pointerEvents = 'none';
    op.style.display = 'none';
  }catch(e){ /* ignore */ }
  hideTooltip();
});

map.on('moveend', ()=> {
  try{
    const op = map.getPanes().overlayPane;
    op.style.display = '';
    op.style.pointerEvents = '';
  }catch(e){ /* ignore */ }
});

/* --- UI helpers --- */
// masquer tooltip quand on clique ailleurs
map.on('click', hideTooltip);

// améliorer affichage en zoomant : réduire poids des lignes quand on est dézoomé
map.on('zoomend', ()=>{
  const z = map.getZoom();
  const weight = Math.max(1, Math.round(4 * (z / 12))); // ajuste selon besoin
  Object.values(layers).forEach(lg => {
    lg.eachLayer(layer => {
      if(layer.setStyle) layer.setStyle({ weight });
    });
  });
});

/* --- Initial --- */
</script>
</body>
</html>
