<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gravelmap.be - Amélioré</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map-container {
  position: relative;
  height: 100vh;
}

#map {
  height: 100%;
}

#legend {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 1000;
  background: rgba(255,255,255,0.95);
  padding: 12px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  font-size: 14px;
  max-width: 300px;
  max-height: 80vh;
  overflow-y: auto;
}

.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
  cursor: pointer;
}

.legend-item input {
  margin-right: 8px;
  cursor: pointer;
}

.legend-color {
  width: 16px;
  height: 16px;
  margin-right: 8px;
  border-radius: 3px;
  border: 1px solid rgba(0,0,0,0.2);
}

.legend-subtitle {
  font-size: 12px;
  color: #666;
  margin-left: 24px;
  margin-top: -4px;
  margin-bottom: 8px;
}

#controls {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 1000;
  display: flex;
  gap: 10px;
}

#controls button {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #2e7d32;
  color: white;
  font-size: 14px;
  font-weight: bold;
  transition: background 0.3s;
}

#controls button:hover {
  background: #1b5e20;
}

#controls button.secondary {
  background: #5d4037;
}

#controls button.secondary:hover {
  background: #3e2723;
}

#osm-info {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  background: rgba(255,255,255,0.9);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 11px;
  text-align: right;
  max-width: 250px;
}

.elevation-icon {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 8px;
  background: #8A2BE2;
  border-radius: 50%;
  position: relative;
}

.elevation-icon:after {
  content: "▲";
  position: absolute;
  top: -2px;
  left: 4px;
  font-size: 10px;
  color: white;
}

.legend-section {
  margin-top: 15px;
  padding-top: 10px;
  border-top: 1px solid #eee;
}

.legend-section-title {
  font-weight: bold;
  margin-bottom: 8px;
  color: #333;
}
</style>
</head>

<body>

<div id="map-container">

  <div id="map"></div>

  <div id="controls">
    <button onclick="loadData()">Charger cette zone</button>
    <button class="secondary" onclick="resetView()">Réinitialiser</button>
  </div>

  <div id="legend">
    <div class="legend-section">
      <div class="legend-section-title">Revêtements</div>
      
      <label class="legend-item" title="Pavés et surfaces en pierre">
        <input type="checkbox" checked onchange="toggleLayer('paves')">
        <div class="legend-color" style="background:#999"></div>
        Pavés / Sett / Dalles
        <div class="legend-subtitle">paving_stones, sett, cobblestone, stone</div>
      </label>

      <label class="legend-item" title="Gravier bien roulant">
        <input type="checkbox" checked onchange="toggleLayer('gravel_roulant')">
        <div class="legend-color" style="background:#7CFC00"></div>
        Graviers roulants
        <div class="legend-subtitle">gravel, compacted, fine_gravel</div>
      </label>

      <label class="legend-item" title="Chemins de bonne qualité">
        <input type="checkbox" checked onchange="toggleLayer('chemin_12')">
        <div class="legend-color" style="background:#228B22"></div>
        Chemins grade 1–2
        <div class="legend-subtitle">tracktype=grade1/grade2</div>
      </label>

      <label class="legend-item" title="Gravier moins roulant">
        <input type="checkbox" checked onchange="toggleLayer('grade3_gravel')">
        <div class="legend-color" style="background:#FFD700"></div>
        Gravier moins roulant
        <div class="legend-subtitle">grade3 + surface connu</div>
      </label>

      <label class="legend-item" title="Grade 3 surface inconnue">
        <input type="checkbox" checked onchange="toggleLayer('grade3_unknown')">
        <div class="legend-color" style="background:#FF8C00"></div>
        Grade 3 inconnu
        <div class="legend-subtitle">tracktype=grade3 sans surface</div>
      </label>
    </div>

    <div class="legend-section">
      <div class="legend-section-title">Côtes & Élévation</div>
      
      <label class="legend-item" title="Cols, sommets et pentes">
        <input type="checkbox" onchange="toggleLayer('elevation_points')">
        <span class="elevation-icon"></span>
        Cols & Sommets
        <div class="legend-subtitle">mountain_pass, peak, saddle</div>
      </label>

      <label class="legend-item" title="Routes avec pente marquée">
        <input type="checkbox" onchange="toggleLayer('elevation_lines')">
        <div class="legend-color" style="background:#8A2BE2"></div>
        Routes avec pente
        <div class="legend-subtitle">incline, steep</div>
      </label>
    </div>
  </div>

  <div id="osm-info">
    Carte générée avec les données OpenStreetMap.<br>
    La réalité peut différer des données.<br>
    <small>Dernière mise à jour : <span id="last-update">-</span></small>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Configuration initiale de la carte
const map = L.map('map').setView([50.6, 4.5], 8);

// Fond de carte
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// Couches existantes améliorées + nouvelles couches pour l'élévation
const layers = {
  // Couches existantes
  paves: L.layerGroup().addTo(map),
  gravel_roulant: L.layerGroup().addTo(map),
  chemin_12: L.layerGroup().addTo(map),
  grade3_gravel: L.layerGroup().addTo(map),
  grade3_unknown: L.layerGroup().addTo(map),
  
  // NOUVELLES couches pour l'élévation
  elevation_points: L.layerGroup().addTo(map),  // Points (cols, sommets)
  elevation_lines: L.layerGroup().addTo(map)    // Lignes (routes avec pente)
};

// Fonction pour basculer les couches
function toggleLayer(name) {
  map.hasLayer(layers[name])
    ? map.removeLayer(layers[name])
    : map.addLayer(layers[name]);
}

// Nettoyage avant rechargement
function clearLayers() {
  Object.values(layers).forEach(l => l.clearLayers());
}

// Réinitialiser la vue
function resetView() {
  map.setView([50.6, 4.5], 8);
  clearLayers();
}

// Chargement des données Overpass
async function loadData() {
  clearLayers();
  
  const b = map.getBounds();
  const bbox = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
  
  // Mise à jour de l'heure
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString('fr-BE');
  
  try {
    // REQUÊTE 1 : Routes et chemins (votre requête originale améliorée)
    const waysQuery = `
    [out:json][timeout:30][bbox:${bbox}];
    (
      // Chemins et pistes
      way["highway"="track"](${bbox});
      way["highway"="path"](${bbox});
      way["highway"="cycleway"](${bbox});
      way["highway"="bridleway"](${bbox});
      way["highway"="footway"](${bbox});
      
      // Routes avec surface spécifique
      way["surface"="paving_stones"](${bbox});
      way["surface"="sett"](${bbox});
      way["surface"="cobblestone"](${bbox});
      way["surface"="unhewn_cobblestone"](${bbox});
      way["surface"="stone"](${bbox});
      
      // Routes avec pente (pour la nouvelle catégorie)
      way["incline"](${bbox});
      way["steep"](${bbox});
    );
    out geom;
    `;
    
    // REQUÊTE 2 : Points d'élévation (cols, sommets)
    const pointsQuery = `
    [out:json][timeout:25][bbox:${bbox}];
    (
      // Cols de montagne
      node["mountain_pass"](${bbox});
      
      // Sommets
      node["natural"="peak"](${bbox});
      node["natural"="saddle"](${bbox});
      
      // Points hauts significatifs
      node["ele"](if: t["ele"] > 200)(${bbox});
    );
    out body;
    `;
    
    console.log("Chargement des données...");
    
    // Exécuter les deux requêtes en parallèle
    const [waysResponse, pointsResponse] = await Promise.all([
      fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: waysQuery
      }),
      fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: pointsQuery
      })
    ]);
    
    const waysData = await waysResponse.json();
    const pointsData = await pointsResponse.json();
    
    console.log(`${waysData.elements.length} ways chargés`);
    console.log(`${pointsData.elements.length} points d'élévation chargés`);
    
    // Traiter les ways (routes et chemins)
    waysData.elements.forEach(el => {
      if (!el.geometry || el.type !== 'way') return;
      
      const coords = el.geometry.map(p => [p.lat, p.lon]);
      const tags = el.tags || {};
      
      let layer = null;
      let color = "#000";
      let popupContent = "";
      
      // DÉTECTION DES PENTES (nouvelle catégorie)
      if (tags.incline || tags.steep) {
        layer = layers.elevation_lines;
        color = "#8A2BE2"; // Violet
        
        popupContent = `<b>Route avec pente</b><br>`;
        if (tags.name) popupContent += `Nom: ${tags.name}<br>`;
        if (tags.incline) popupContent += `Pente: ${tags.incline}<br>`;
        if (tags.steep) popupContent += `Raideur: ${tags.steep}<br>`;
        if (tags.highway) popupContent += `Type: ${tags.highway}`;
      }
      // DÉTECTION DES PAVÉS (catégorie étoffée)
      else if (["paving_stones", "sett", "cobblestone", "unhewn_cobblestone", "stone"].includes(tags.surface)) {
        layer = layers.paves;
        color = "#999";
        
        popupContent = `<b>Pavés / Sett</b><br>`;
        if (tags.name) popupContent += `Nom: ${tags.name}<br>`;
        popupContent += `Surface: ${tags.surface}`;
      }
      // GRAVIERS ROULANTS (étoffé)
      else if (["gravel", "compacted", "fine_gravel"].includes(tags.surface)) {
        layer = layers.gravel_roulant;
        color = "#7CFC00";
        
        popupContent = `<b>Gravier roulant</b><br>`;
        if (tags.name) popupContent += `Nom: ${tags.name}<br>`;
        popupContent += `Surface: ${tags.surface}`;
      }
      // CHEMINS GRADE 1-2
      else if (tags.tracktype === "grade1" || tags.tracktype === "grade2") {
        layer = layers.chemin_12;
        color = "#228B22";
        
        popupContent = `<b>Chemin grade ${tags.tracktype === "grade1" ? "1" : "2"}</b><br>`;
        if (tags.name) popupContent += `Nom: ${tags.name}<br>`;
        if (tags.surface) popupContent += `Surface: ${tags.surface}`;
      }
      // GRADE 3 AVEC SURFACE
      else if (tags.tracktype === "grade3" && tags.surface) {
        layer = layers.grade3_gravel;
        color = "#FFD700";
        
        popupContent = `<b>Chemin grade 3</b><br>`;
        if (tags.name) popupContent += `Nom: ${tags.name}<br>`;
        popupContent += `Surface: ${tags.surface}`;
      }
      // GRADE 3 SANS SURFACE
      else if (tags.tracktype === "grade3") {
        layer = layers.grade3_unknown;
        color = "#FF8C00";
        
        popupContent = `<b>Chemin grade 3</b><br>`;
        if (tags.name) popupContent += `Nom: ${tags.name}<br>`;
        popupContent += `Surface: inconnue`;
      }
      
      // Ajouter la polyligne si une couche a été trouvée
      if (layer) {
        const line = L.polyline(coords, {
          color: color,
          weight: tags.incline ? 5 : 4, // Plus épais pour les pentes
          opacity: 0.9,
          lineCap: 'round'
        });
        
        if (popupContent) {
          line.bindPopup(popupContent);
        }
        
        line.addTo(layer);
      }
    });
    
    // Traiter les points d'élévation (cols et sommets)
    pointsData.elements.forEach(el => {
      if (el.type !== 'node' || !el.lat || !el.lon) return;
      
      const tags = el.tags || {};
      
      // Détecter le type de point
      let pointType = "Point d'élévation";
      let iconColor = "#8A2BE2";
      let iconSize = 8;
      
      if (tags.mountain_pass) {
        pointType = "Col de montagne";
        iconSize = 10;
      } else if (tags.natural === "peak") {
        pointType = "Sommet";
        iconColor = "#9400D3"; // Violet plus foncé pour les sommets
        iconSize = 12;
      } else if (tags.natural === "saddle") {
        pointType = "Col naturel";
        iconSize = 9;
      }
      
      // Créer le marqueur
      const marker = L.circleMarker([el.lat, el.lon], {
        color: iconColor,
        fillColor: iconColor,
        radius: iconSize,
        weight: 2,
        opacity: 0.9,
        fillOpacity: 0.7
      });
      
      // Créer le contenu de la popup
      let popupContent = `<b>${pointType}</b><br>`;
      if (tags.name) popupContent += `Nom: ${tags.name}<br>`;
      if (tags.ele) popupContent += `Altitude: ${tags.ele} m<br>`;
      if (tags.mountain_pass) popupContent += `Type: Col<br>`;
      if (tags.natural === "peak") popupContent += `Type: Sommet`;
      if (tags.natural === "saddle") popupContent += `Type: Col naturel`;
      
      marker.bindPopup(popupContent);
      marker.addTo(layers.elevation_points);
    });
    
    console.log("Données chargées avec succès !");
    
  } catch (error) {
    console.error("Erreur lors du chargement:", error);
    alert("Erreur lors du chargement des données. Veuillez réessayer.");
  }
}

// Initialisation
loadData(); // Charger automatiquement au démarrage
</script>

</body>
</html>
